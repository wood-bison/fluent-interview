schemaVersion: 1
workspace:
  id: fluent-interview
  purpose: desktop-first interview learning platform workspace
  defaultMode: development
  hostTargets:
    - macbook-pro-16
    - apple-studio-display

repositories:
  - id: fluent-engineering-lab
    path: fluent-engineering-lab
    role: learning-api
    remote: git@github-woodbison:wood-bison/ai-fluent-engineering-lab.git
    branch: main
    revision: 8e76a6764d7195a55ec580c3bfe8c1e359038013
  - id: fluent-engineering-vue
    path: fluent-engineering-vue
    role: learner-web
    remote: local-only
    branch: main
    revision: 1ddcc83d581bd02a7c1645971a3c4f7b69d5c76b
  - id: fluent-question-brain
    path: fluent-question-brain
    role: question-source-of-truth
    remote: git@github-woodbison:wood-bison/fluent-question-brain.git
    branch: main
    revision: 3bdd72d3088b8a11002db1154910bf19ba973520
  - id: fluent-task-runtime
    path: fluent-task-runtime
    role: task-execution-authority
    remote: git@github-woodbison:wood-bison/fluent-task-runtime.git
    branch: main
    revision: 6b097718fe4f6075a1f4baf1d55dc6d71dcbf137
  - id: fluent-question-vault
    path: fluent-question-vault
    role: card-history-mirror
    remote: git@github.com:szhechko/fluent-question-vault.git
    branch: main
    revision: f4d46228cd366c218b29423323da8fe8bad796f1

services:
  - id: question-brain
    repository: fluent-question-brain
    composeProject: fluent-question-brain
    composeFile: fluent-question-brain/deploy/compose/compose.yaml
    readiness: http://127.0.0.1:48127/health/ready
    ui: http://localhost:48128/admin
  - id: task-runtime
    repository: fluent-task-runtime
    composeProject: fluent-task-runtime
    composeFile: fluent-task-runtime/deploy/compose/compose.yaml
    readiness: http://127.0.0.1:48227/v1/health/ready
  - id: fluent-lab
    repository: fluent-engineering-lab
    devCommand: pnpm dev
    # Vue is the only learner and operator shell for the standard launch.
    devUrl: http://localhost:47350/
    productionCommand: pnpm package:local
    productionUrl: http://localhost:49300/onboarding

observability:
  # One shared Trace Explorer for the three repositories. This is a neutral
  # workspace concern, not a second Task Runtime UI.
  traceExplorerUrl: http://localhost:56686
  collector:
    otlpGrpc: 54317
    otlpHttp: 54318

ports:
  policy: dedicated-high-host-ports
  fluentLab:
    devWeb: 47350
    devApi: 47000
    packageWeb: 49300
    packageApi: 49301
    postgres: 49302
    redis: 49303
    grafana: 49304
    prometheus: 49305
    loki: 49306
    kafka: 49312
  questionBrain:
    api: 48127
    cms: 48128
    postgres: 55437
    traceExplorerUi: 56686
    otlpGrpc: 54317
    otlpHttp: 54318
  taskRuntime:
    api: 48227

contracts:
  questionBrain: released HTTP projection only
  taskRuntime: versioned HTTP runtime contract only
  sharedCode: no cross-service ORM or database sharing
